<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16202B">
<title>Homework Check</title>
<style>
:root{
  --ground:#16202B; --surface:#1F2C3A; --raised:#27384A; --edge:#33475C;
  --ink:#E8EEF3; --muted:#8CA3B8;
  --confirm:#4FB3A2; --attention:#E8A33D; --flag:#E0655B; --info:#5B8DEF;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sys);font-size:17px;line-height:1.4;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{max-width:640px;margin:0 auto;padding:0 12px 14px;overflow-x:hidden}
html,body{max-width:100%;overflow-x:hidden}

header{display:flex;align-items:baseline;gap:9px;padding:16px 2px 12px;position:sticky;top:0;
  background:var(--ground);z-index:5;max-width:100%;overflow:hidden}
.back{flex:none}
h1{font-size:19px;font-weight:650;letter-spacing:-.2px;margin:0;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:14px;margin:-4px 2px 14px}
.back{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.cog{font-size:21px;color:var(--muted);padding:0 4px}

button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:13px;margin-bottom:9px}
.card.tap{display:block;width:100%;text-align:left}
.card.tap:active{background:var(--raised)}
.row{display:flex;align-items:center;gap:9px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name{font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.03em}

.btn{display:block;width:100%;background:var(--confirm);color:#0C1A1E;font-weight:650;padding:16px;
  border-radius:13px;text-align:center;font-size:17px;margin-top:7px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:none;border:1px solid var(--edge);color:var(--ink);font-weight:500}
.btn.sm{padding:11px;font-size:15px}
.btn.warn{background:var(--attention);color:#231603}
.btn.danger{color:var(--flag);border-color:var(--flag)}

textarea,input[type=text],input[type=date]{width:100%;max-width:100%;min-width:0;background:var(--ground);
  border:1px solid var(--edge);border-radius:11px;color:var(--ink);padding:13px;font-size:17px;
  -webkit-user-select:text;user-select:text}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;height:50px;
  font-family:var(--sys);text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
textarea{min-height:150px;font-family:var(--mono);font-size:12.5px;line-height:1.5}

.student{border-bottom:1px solid var(--edge);padding:8px 0}
.student:last-child{border-bottom:none}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.strip.four{grid-template-columns:repeat(4,1fr)}
.strip.six{grid-template-columns:repeat(6,1fr)}
.chip{padding:12px 0;border-radius:10px;border:1px solid var(--edge);text-align:center;
  font-family:var(--mono);font-size:16px;font-weight:600;color:var(--muted)}
.chip:active{background:var(--raised)}
.chip.on{background:var(--confirm);border-color:var(--confirm);color:#0C1A1E}
.chip.on.low{background:var(--flag);border-color:var(--flag);color:#2A0D0B}
.chip.on.info{background:var(--info);border-color:var(--info);color:#08152E}
.chip.on.warn{background:var(--attention);border-color:var(--attention);color:#231603}
.chip.on.ex{background:var(--muted);border-color:var(--muted);color:#101922}
.rv.ex .mk{color:var(--muted)} .rv.ex .who{color:var(--muted)}
.chip.quiet{color:var(--muted);font-size:13px}
.chip.dash{flex:none;width:48px;padding:9px 0;font-size:15px}
.untouched .name{color:var(--attention)}

/* grid-auto-rows pins both rows to the same height, so a row can't grow to fit
   its tallest child. */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:40px;gap:6px;margin:0 0 13px}
/* display:block with line-height, NOT flex. Safari won't reliably apply a height
   to a <button> that is itself a flex container inside a grid — the grid's
   stretch wins and the buttons come out different sizes. Centring the glyph with
   line-height sidesteps the whole thing. */
.tab{width:100%;height:40px;min-height:40px;max-height:40px;align-self:center;
  padding:0;margin:0;box-sizing:border-box;
  display:block;line-height:38px;text-align:center;overflow:hidden;
  border-radius:10px;border:1px solid var(--edge);
  font-family:var(--mono);font-size:18px;font-weight:700;color:var(--muted)}
.tab.todo{border-color:var(--attention);color:var(--attention)}
.tab.done{color:var(--confirm);border-color:var(--edge)}
.tab.now{background:var(--raised);color:var(--ink);border-color:var(--ink)}
.tab.empty{opacity:.32}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}
.grid2>*{min-width:0;max-width:100%}
.att{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:11px 10px;
  text-align:left;min-width:0;max-width:100%;overflow:hidden;box-sizing:border-box}
.att:active{background:var(--raised)}
.att .who{font-size:15px;font-weight:600;letter-spacing:-.15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .code{font-family:var(--mono);font-size:11.5px;margin-top:2px;color:var(--confirm)}
.att.ex{border-color:var(--attention)} .att.ex .code{color:var(--attention)}
.att.gone{border-color:var(--flag)} .att.gone .code{color:var(--flag)}

.rv{background:var(--surface);border:1px solid var(--edge);border-radius:11px;padding:10px;
  display:flex;align-items:center;gap:8px;text-align:left;
  width:100%;min-width:0;max-width:100%;overflow:hidden;box-sizing:border-box}
.rv .meta{flex:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv:active{background:var(--raised)}
.rv .who{flex:1 1 0;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .mk{font-family:var(--mono);font-size:15px;font-weight:700;width:32px;text-align:center;flex:none}
.rv.good .mk{color:var(--confirm)} .rv.bad .mk{color:var(--flag)}
.rv.info .mk{color:var(--info)} .rv.none{border-color:var(--attention)} .rv.none .mk{color:var(--attention)}
.slot{background:var(--ground);border:1px dashed var(--edge);border-radius:9px;padding:9px 8px;
  font-size:13px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:38px}
.slot.full{background:var(--surface);border-style:solid}

.tally{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap}
.tally span{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);
  border:1px solid var(--edge);border-radius:8px;padding:5px 9px}
.tally span.warn{color:var(--attention);border-color:var(--attention)}
.warnbox{background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.45);border-radius:12px;padding:12px;margin-bottom:11px}
.okbox{border:1px solid var(--confirm);border-radius:12px;padding:12px;margin-bottom:11px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}

/* Solid, not a gradient. The gradient faded to transparent at the top, so on
   the grading screen — where the bar holds six table buttons plus Done — the
   rows underneath showed straight through it. */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ground);
  border-top:1px solid var(--edge);
  padding:8px 12px calc(4px + env(safe-area-inset-bottom));z-index:10}
.bar .inner{max-width:640px;margin:0 auto}
.bar .btn{margin-top:6px} .bar .grid2{gap:6px;margin-top:6px} .bar .grid2 .btn{margin-top:0}
.bar .tabs{margin:0}
.gonext{font-family:var(--mono);font-size:12px;color:var(--confirm);letter-spacing:.07em;
  text-transform:uppercase;flex:none}
.sheet{position:fixed;inset:0;background:rgba(8,13,18,.72);z-index:50;display:flex;align-items:flex-end}
.sheet .panel{background:var(--surface);border-top:1px solid var(--edge);border-radius:18px 18px 0 0;
  padding:16px 12px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:640px;margin:0 auto;
  max-height:86vh;overflow-y:auto;overflow-x:hidden}
</style>
</head>
<body>
<div id="app"></div><div id="bar"></div><div id="sheet"></div>
<script>
/* ============ constants ============ */
const MARKS=[['5','complete','good'],['4','mostly complete','good'],
             ['NC','not complete','bad'],['MU','absent when assigned','info'],
             ['AB','absent today','info']];
const DASH=['--','not checked','warn'];
const EXCUSED=['EX','excused — does not count','ex'];
const ALL=MARKS.concat([DASH]);        // what you reach while grading
const ALLX=ALL.concat([EXCUSED]);      // plus excused, in Records only
const ATT=[['AB','absent'],['T','tardy'],['TE','excused tardy'],['TX','excessive tardy'],['P','present']];
const ABSENT=['AB','TX'];              // these fill a homework AB
const TABLEQ=['AB','MU','--'];         // interrupts you at the table
const OPEN=['NC','AB','MU','--'];      // counts as owed in records & late work
const TABLES=6, SEATS=4;
const DAYL=['Sun','Mon','Tues','Wed','Thurs','Fri','Sat'];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const show=k=>k==='--'?'—':k;
const nameOf=k=>(ALLX.find(x=>x[0]===k)||[,''])[1]||k;
const toneOf=k=>(ALLX.find(x=>x[0]===k)||[,,''])[2]||'';

/* Local dates throughout — toISOString() is UTC and rolls a US evening into tomorrow. */
function today(){const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
function iso(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
/* one date style everywhere, app and sheet alike: Mon 08/17 */
function when(s){
  const p=String(s||'').split('-').map(Number);
  if(p.length<3||!p[0])return String(s||'');
  return DAYL[new Date(p[0],p[1]-1,p[2]).getDay()]+' '+String(p[1]).padStart(2,'0')+'/'+String(p[2]).padStart(2,'0');
}

/* ============ state ============ */
let S=load(), V={view:'home'};

/* Each class is stored under its own key. A tap rewrites only the class you are
   in — a whole year in one blob meant re-serializing ~1MB on every button press. */
function load(){
  let cfg={},sections=[];
  try{
    const idx=JSON.parse(localStorage.getItem('hw:index')||'null');
    if(Array.isArray(idx)&&idx.length){
      cfg=JSON.parse(localStorage.getItem('hw:cfg')||'{}')||{};
      sections=idx.map(id=>{try{return JSON.parse(localStorage.getItem('hw:s:'+id))}catch(e){return null}}).filter(Boolean);
    }else{
      const legacy=localStorage.getItem('hwcheck');       // one-time move from the old key
      if(legacy){const o=JSON.parse(legacy)||{};cfg=o.cfg||{};sections=o.sections||[]}
    }
  }catch(e){}
  if(!sections.length)sections=[demo()];
  sections.forEach(migrate);
  return {sections,cfg};
}
function save(all){
  try{
    localStorage.setItem('hw:index',JSON.stringify(S.sections.map(s=>s.id)));
    localStorage.setItem('hw:cfg',JSON.stringify(S.cfg));
    const list=(all||!V.sid)?S.sections:S.sections.filter(s=>s.id===V.sid);
    list.forEach(s=>localStorage.setItem('hw:s:'+s.id,JSON.stringify(s)));
    localStorage.removeItem('hwcheck');
  }catch(e){alert('Storage full — take a backup, then delete an old class.')}
}
function saveAll(){save(true)}
function forget(id){try{localStorage.removeItem('hw:s:'+id)}catch(e){}}

/* Old builds stored one "meeting" holding attendance and scores together.
   Split each into a session and an assignment so nothing is lost. */
function migrate(s){
  if(!s.items){
    s.items=[];
    (s.meetings||[]).forEach(m=>{
      if(m.attendance)s.items.push({id:uid(),kind:'session',date:m.date,
        attendance:m.attendance,closed:!!m.closed,synced:!!m.synced});
      s.items.push({id:m.id||uid(),kind:'hw',title:m.title,date:m.date,
        scores:m.scores||{},closed:!!m.closed,synced:!!m.synced});
    });
    delete s.meetings;
  }
  s.students=s.students||[];
  // older builds recorded a joiner as a count; make it an explicit mark instead
  const wasClosed=s.items.filter(x=>x.kind==='hw'&&x.closed);
  s.students.forEach(st=>{
    if(st.from==null)return;
    wasClosed.slice(0,st.from).forEach(h=>{
      if(h.scores[st.id]===undefined){h.scores[st.id]={code:'EX',touched:true};h.synced=false}
    });
    delete st.from;
  });
  // one-time: existing students get a number in the order they're already in
  if(s.students.some(st=>!st.out&&!st.num))giveCubbies(s,s.students.filter(st=>!st.out));
  s.tables=padTables(s.tables);
}
function padTables(t){
  const flat=(t||[]).flat().filter(Boolean);
  const out=[];
  for(let i=0;i<TABLES;i++){
    const row=((t||[])[i]||[]).slice(0,SEATS);
    while(row.length<SEATS)row.push(null);
    out.push(row);
  }
  // anything that fell outside 6x4 goes into the first free seats
  flat.forEach(id=>{if(!out.flat().includes(id))place(out,id)});
  return out;
}
function place(tables,id){
  for(let t=0;t<TABLES;t++)for(let k=0;k<SEATS;k++)if(!tables[t][k]){tables[t][k]=id;return true}
  return false;
}

function demo(){
  const raw=`Bohr\tNiels
Chandrasekhar\tSubrahmanyan
Curie\tMarie
Dirac\tPaul
Faraday\tMichael
Feynman\tRichard
Franklin\tRosalind
Hawking\tStephen
Heisenberg\tWerner
Hopper\tGrace
Joule\tJames
Kepler\tJohannes
Lovelace\tAda
Maxwell\tJames
Newton\tIsaac
Noether\tEmmy
Payne\tCecilia
Rutherford\tErnest
Wu\tChien-Shiung`;
  return mkSection('Sample class',raw);
}
function mkSection(name,raw){
  const students=parseRoster(raw);
  const tables=padTables([]);
  students.forEach(st=>place(tables,st.id));
  const s={id:uid(),name,students,tables,items:[]};
  giveCubbies(s,students);
  return s;
}
function parseRoster(raw){
  return String(raw||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    if(line.indexOf('\t')>=0){                       // pasted from a spreadsheet
      const p=line.split('\t');
      return {id:uid(),last:(p[0]||'').trim(),first:(p[1]||'').trim(),
              extra:(p[2]||'').trim(),cubby:(p[3]||'').trim()};
    }
    if(line.indexOf(',')>=0){                        // "Cox, Brian"
      const p=line.split(',');
      return {id:uid(),last:(p[0]||'').trim(),first:(p.slice(1).join(',')||'').trim()};
    }
    // typed by hand, spaces only — no Tab key on an iPhone. Read it as
    // "Brian Cox": everything before the final word is the first name.
    const w=line.split(/\s+/);
    if(w.length===1)return {id:uid(),last:w[0],first:''};
    return {id:uid(),last:w[w.length-1],first:w.slice(0,-1).join(' ')};
  }).filter(s=>s.last||s.first);
}

/* ============ lookups ============ */
const sec=()=>S.sections.find(x=>x.id===V.sid);
const item=()=>{const s=sec();return s&&s.items.find(x=>x.id===V.iid)};
const stu=(s,id)=>s.students.find(x=>x.id===id);
const act=s=>s.students.filter(st=>!st.out);
const gone=s=>s.students.filter(st=>st.out);
const label=st=>st?`${st.last}${st.first?', '+st.first:''}`:'';
/* the seating chart always uses what they go by: "Alex B." */
/* A cubby number, once given, is that student's for the year — a withdrawal
   never renumbers anyone else. The vacated number does become available again,
   so a later arrival can take it. Only students currently in the class hold a
   number against the pool; someone who left keeps theirs on their own record. */
function nextCubby(s){
  const taken={};
  // filtered inline rather than via act(): this runs during load(), before the
  // const helpers further down the file exist
  s.students.filter(st=>!st.out).forEach(st=>{if(st.num)taken[st.num]=true});
  for(let n=1;n<=30;n++)if(!taken[n])return n;   // 30 cubbies on the wall
  return null;
}
function giveCubbies(s,list){
  (list||[]).forEach(st=>{if(!st.num)st.num=nextCubby(s)});
}
const seatName=st=>st?`${(st.pref||st.first||'').trim()} ${(st.last||'').trim().charAt(0)}.`.trim():'';
/* what goes in column P — the whole name, so you can shorten it yourself in O */
const fullSeat=st=>st?`${(st.pref||st.first||'').trim()} ${(st.last||'').trim()}`.trim():'';
/* Everything lists by the date on the record, not the order you made it — so a
   stack graded on Wednesday for Monday's work sits with Monday's. Same-day
   records keep the order you created them in. */
function inDateOrder(s,list){
  const ix={};s.items.forEach((x,i)=>{ix[x.id]=i});
  return list.slice().sort((a,b)=>a.date===b.date?ix[a.id]-ix[b.id]:(a.date<b.date?-1:1));
}
const hws=s=>inDateOrder(s,s.items.filter(x=>x.kind==='hw'));
const sessions=s=>inDateOrder(s,s.items.filter(x=>x.kind==='session'));
const sessionOn=(s,d)=>sessions(s).filter(x=>x.date===d).slice(-1)[0];
const hwsOn=(s,d)=>hws(s).filter(x=>x.date===d);
const markOf=v=>v?(v.code||(v.val!=null?String(v.val):null)):null;
const unsynced=s=>s.items.filter(x=>x.closed&&!x.synced);
/* Closing an assignment gives every student a mark, so a student with no entry
   at all can only mean their auto-AB was cleared by a late arrival. Those need
   a real score. */
const needScore=(s,h)=>h.closed?act(s).filter(st=>h.scores[st.id]===undefined).length:0;
const seatedIds=s=>s.tables.flat().filter(Boolean);
const unseated=s=>act(s).filter(st=>!seatedIds(s).includes(st.id));
const tableIds=(s,i)=>s.tables[i].filter(Boolean).filter(id=>{const st=stu(s,id);return st&&!st.out});

/* what a student still owes — no expiry, NC included */
function closedHws(s){return hws(s).filter(h=>h.closed)}
/* The current true mark, whichever slot it's in: a regrade if one exists,
   otherwise the original. Regrading AB to NC is a real update — the sheet
   should show NC — but it doesn't resolve anything: NC is still not a passing
   grade, so it has to keep showing up as owed until it becomes a number. */
function effective(v){return v&&v.rev!=null?v.rev:(v&&v.code)}
function openList(s,id){
  return closedHws(s).filter(h=>OPEN.includes(effective(h.scores[id])));
}
/* One pass over the class: assignment id -> students who still owe it.
   Late work and the class screen both needed this per-student, which was
   O(assignments x students) on every render. */
function owedIndex(s){
  const out={},roster=act(s);
  roster.forEach(st=>openList(s,st.id).forEach(h=>{(out[h.id]=out[h.id]||[]).push(st)}));
  return out;
}
/* what interrupts you at the table — expires, NC excluded */
/* Everything still unresolved, oldest first — no lookback window. A student out
   three days owes every assignment from those three days, and capping the list
   at the two most recent would quietly drop work still to be collected. The
   table row shows a count rather than the whole list; the catch-up panel is
   where it gets worked through. */
function tableQueue(s,id,exclude){
  return hws(s).filter(h=>h.closed&&h.id!==exclude&&TABLEQ.includes(effective(h.scores[id])));
}
function pendingSend(s){
  let n=0;hws(s).forEach(h=>Object.values(h.scores).forEach(v=>{if(v&&v.rev!=null&&!v.sent)n++}));
  return n;
}
function dupes(list){
  const by={},out=[];
  list.forEach(st=>{const k=((st.last||'')+'|'+(st.first||'')).trim().toLowerCase();(by[k]=by[k]||[]).push(st)});
  Object.keys(by).forEach(k=>{if(by[k].length>1)out.push(by[k])});
  return out;
}

/* ============ chrome ============ */
function head(title,eyebrow,back,lbl,right){
  return `<header>${back?`<button class="back" onclick="${back}">‹ ${esc(lbl||'Back')}</button>`:''}
    <h1>${esc(title)}</h1><span class="eyebrow">${esc(eyebrow||'')}</span>
    ${right||''}</header>`;
}
/* Reserve exactly as much room as this screen's bar actually needs. A fixed
   number can't work: the grading bar (six table buttons plus Done) is roughly
   twice the height of a one-button bar, so sizing for the tallest left every
   other screen with dead space at the bottom — enough to make short pages
   scroll when they shouldn't. */
function bar(html){
  const el=$('bar');
  el.innerHTML=html?`<div class="bar"><div class="inner">${html}</div></div>`:'';
  const box=el.firstElementChild;
  const app=$('app');
  if(app&&app.style){
    app.style.paddingBottom=(box&&box.offsetHeight?box.offsetHeight+14:14)+'px';
  }
}
function banner(){
  if(V.busy)return `<div class="warnbox"><div class="meta">${esc(V.busy)}</div></div>`;
  if(V.err)return `<div class="warnbox" style="border-color:var(--flag)"><div class="meta" style="color:var(--flag)">${esc(V.err)}</div></div>`;
  if(V.ok)return `<div class="okbox"><div class="meta" style="color:var(--confirm)">${esc(V.ok)}</div></div>`;
  return '';
}
function closeSheet(){$('sheet').innerHTML=''}
function panel(inner){
  $('sheet').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSheet()">
    <div class="panel">${inner}</div></div>`;
}
function go(v){V.view=v;render();window.scrollTo(0,0)}

const VIEWS={};
/* Each screen expects a particular kind of record. If state drifts — a stale id,
   a deleted class — fall back rather than throw a blank page. */
const NEEDS={grade:'hw',review:'hw',lateone:'hw',attendance:'session'};
function render(){
  closeSheet();
  if(V.view!=='home'&&V.view!=='menu'&&V.view!=='add'&&V.view!=='sync'&&V.view!=='backup'&&!sec())V.view='home';
  const need=NEEDS[V.view];
  if(need){const it=item();if(!it||it.kind!==need)V.view=sec()?'section':'home'}
  (VIEWS[V.view]||VIEWS.home)();
}

/* ============ home ============ */
VIEWS.home=function(){
  const stuck=S.sections.reduce((n,s)=>n+unsynced(s).length,0);
  const list=S.sections.map(s=>{
    const un=unsynced(s).length, d=today();
    const sess=sessionOn(s,d), hw=hwsOn(s,d);
    return `<button class="card tap" onclick="V.sid='${s.id}';go('section')">
      <div class="row"><div class="grow">
        <div class="name trunc">${esc(s.name)}</div>
        <div class="meta">${act(s).length} students · ${closedHws(s).length} assignments</div>
      </div>${un?`<span class="meta" style="color:var(--attention)">${un} unsent</span>`:''}</div>
      ${sess?`<div class="meta" style="margin-top:7px;color:var(--confirm)">Attendance taken ${esc(when(d))}${hw.length?` · ${hw.length} assignment${hw.length===1?'':'s'} today`:''}</div>`:''}
    </button>`}).join('');
  const age=backupAge();
  const stale=age===null||age>10;
  $('app').innerHTML=head('Classes','',null,null,
      `<button class="cog" onclick="go('menu')">⚙</button>`)+banner()+
    (S.cfg.url?`<div class="meta" style="text-align:center;margin:-4px 0 10px;
       ${stale?'color:var(--attention)':''}">Last backup: ${age===null?'never':
       age===0?'today':age===1?'yesterday':age+' days ago'}</div>`:'')+
    (S.sections.length?list:'<div class="empty">No classes yet.<br>Add one from the ⚙ menu.</div>')+
    (S.cfg.url?'':`<div class="warnbox"><div class="meta" style="color:var(--attention)">Sheet sync not set up — scores stay on this phone.</div></div>`);
  bar(stuck?`<button class="btn" onclick="syncAll()">Send ${stuck} to the sheet</button>`:'');
};

VIEWS.menu=function(){
  const stuck=S.sections.reduce((n,s)=>n+unsynced(s).length,0);
  $('app').innerHTML=head('Settings','',"go('home')",'Classes')+banner()+
    `<button class="card tap" onclick="go('add')"><div class="name">Add a class</div>
       <div class="meta">Paste a roster</div></button>
     <button class="card tap" onclick="go('sync')"><div class="name">Sheet sync</div>
       <div class="meta">${S.cfg.url?'Connected':'Not set up'}</div></button>
     <button class="card tap" onclick="pushCubbies()"><div class="name">Cubby list</div>
       <div class="meta">Printable numbers for every class</div></button>
     <button class="card tap" onclick="go('backup')"><div class="name">Backup &amp; restore</div>
       <div class="meta">All classes${stuck?' · '+stuck+' unsent':''}</div></button>
     <button class="card tap" onclick="forceUpdate()"><div class="name">Check for an update</div>
       <div class="meta">Running build ${esc(BUILD)}</div></button>`;
  bar('');
};

/* ============ one class ============ */
VIEWS.section=function(){
  const s=sec(),d=today(),sess=sessionOn(s,d),hw=hwsOn(s,d);
  const live=s.items.filter(x=>!x.closed);
  const openHw=Object.keys(owedIndex(s)).length;
  const un=unsynced(s).length, pend=pendingSend(s);
  const todayCard=`<div class="card">
    <div class="eyebrow">Today · ${esc(when(d))}</div>
    <div style="margin-top:8px">${sess
      ? `<div class="meta" style="color:var(--confirm)">Attendance done — ${
          Object.values(sess.attendance).filter(c=>c&&c!=='P').length} exception(s)</div>`
      : `<div class="meta">No attendance yet</div>`}</div>
    ${hw.length?hw.map(h=>{const n=needScore(s,h);
      return `<button class="rv ${n?'none':h.closed?'good':'none'}" style="margin-top:7px"
        onclick="openHwItem('${h.id}')"><span class="mk">${n?'!':h.closed?'✓':'…'}</span>
        <span class="who">${esc(h.title)}</span>
        <span class="meta">${n?`${n} to score`:h.closed?'done':'in progress'}</span></button>`}).join('')
      :`<div class="meta" style="margin-top:6px">No assignments logged today</div>`}</div>`;
  const others=live.filter(x=>x.date!==d);
  $('app').innerHTML=head(s.name,'',"go('home')",'Classes')+banner()+todayCard+
    (others.length?`<div class="card"><div class="eyebrow" style="color:var(--attention)">Unfinished</div>
      ${others.map(x=>`<div class="rv none" style="margin-top:7px">
        <span class="mk">…</span>
        <button class="who" style="text-align:left" onclick="${x.kind==='session'
          ? `V.iid='${x.id}';go('attendance')` : `openHwItem('${x.id}')`}">${esc(x.title||'Attendance')}</button>
        <span class="meta">${esc(when(x.date))}</span>
        <button class="chip quiet" style="width:66px;padding:7px 0" onclick="discard('${x.id}')">Discard</button>
      </div>`).join('')}</div>`:'')+
    `<div class="grid2" style="margin-top:14px">
      <button class="card tap" onclick="go('late')" style="margin:0"><div class="name">Late work</div>
        <div class="meta">${openHw?openHw+' assignment'+(openHw===1?'':'s'):'nothing open'}</div></button>
      <button class="card tap" onclick="go('records')" style="margin:0"><div class="name">Gradebook</div>
        <div class="meta">${closedHws(s).length} assignment${closedHws(s).length===1?'':'s'}</div></button>
      <button class="card tap" onclick="go('seats')" style="margin:0"><div class="name">Seating</div>
        <div class="meta">${unseated(s).length?unseated(s).length+' unseated':'all seated'}</div></button>
      <button class="card tap" onclick="go('roster')" style="margin:0"><div class="name">Roster</div>
        <div class="meta">add or remove</div></button>
    </div>`+
    // always shown, not only when there's something pending — closing an
    // assignment syncs automatically, so a "only if needed" button would
    // essentially never appear and you'd have no manual way to reach it
    `<button class="btn ghost sm" style="margin-top:9px${un?'':';color:var(--muted)'}"
       onclick="syncSection('${s.id}',false)">${un?`Send ${un} to the sheet`:'Everything is in the sheet'}</button>
     <button class="btn ghost sm" style="margin-top:9px${pend?'':';color:var(--muted)'}"
       onclick="markSentFor('${s.id}')">${pend?`Clear ${pend} regrade highlight${pend===1?'':'s'}`
         :'No regrades waiting on Schoology'}</button>`;
  bar(`<button class="btn" onclick="${sess?`V.iid='${sess.id}';go('attendance')`:'newSession()'}">
        ${sess?'Attendance — edit':'Take attendance'}</button>
      <button class="btn ghost" onclick="newHwSheet()">Grade an assignment</button>`);
};

function discard(id){
  const s=sec(),x=s.items.find(i=>i.id===id);
  if(!x)return;
  const n=Object.keys(x.kind==='session'?(x.attendance||{}):(x.scores||{})).length;
  if(!confirm(`Discard "${x.title||'attendance'}" from ${when(x.date)}?\n\n`+
    `${n} mark${n===1?'':'s'} recorded. It was never closed, so nothing reached the sheet.`))return;
  s.items=s.items.filter(i=>i.id!==id);
  if(V.iid===id)V.iid=null;
  save();render();
}
function newSession(){
  const s=sec(),d=today();
  const it={id:uid(),kind:'session',date:d,attendance:{},closed:false,synced:false};
  s.items.push(it);V.iid=it.id;save();go('attendance');
}
function openHwItem(id){
  V.iid=id;const h=item();V.tab=firstTodo();
  // by table only while walking the room; anything opened afterwards — from All
  // assignments, or revisiting a closed one — reads better alphabetically
  V.az=h.closed?true:!!h.stack;
  if(!h.closed)V.list=false;
  go(h.closed?'review':'grade');
}

/* ============ new assignment: name + date ============ */
/* The same homework usually goes to more than one section, so offer what the
   other classes have used lately. Only names this class hasn't used itself —
   an assignment already here doesn't need suggesting. */
function recentTitles(s){
  const mine={};hws(s).forEach(h=>{mine[h.title.trim().toLowerCase()]=true});
  const seen={},out=[];
  S.sections.forEach(o=>{
    if(o.id===s.id)return;
    hws(o).slice().reverse().forEach(h=>{
      const t=(h.title||'').trim(),k=t.toLowerCase();
      if(!t||mine[k]||seen[k])return;
      seen[k]=true;out.push({title:t,from:o.name,date:h.date});
    });
  });
  return out.sort((a,b)=>a.date<b.date?1:-1).slice(0,6);
}
function useTitle(t){$('ttl').value=t}

function newHwSheet(){
  const s=sec(),n=hws(s).length+1;
  const recent=recentTitles(s);
  panel(`<div class="eyebrow">${esc(s.name)}</div>
    <h1 style="margin:6px 0 12px">New assignment</h1>
    <input type="text" id="ttl" value="HW ${n}" autocomplete="off">
    ${recent.length?`<div class="tally" style="margin:8px 0 0">${recent.map(r=>
      `<span onclick="useTitle('${esc(r.title).replace(/'/g,"\\'")}')" style="cursor:pointer"
        title="${esc(r.from)}">${esc(r.title)}</span>`).join('')}</div>
      <div class="meta" style="margin-top:5px">Recently used in your other classes — tap to reuse.</div>`:''}
    <div style="height:9px"></div>
    <input type="date" id="dte" value="${today()}">
    <div class="meta" style="margin-top:8px">Absences from that day fill in as AB automatically.</div>
    <button class="btn" onclick="createHw(false)">Grade at the tables</button>
    <button class="btn ghost" onclick="createHw(true)">Grade a stack</button>
    <button class="btn ghost sm" onclick="closeSheet()">Cancel</button>`);
}
function createHw(stack){
  const s=sec(),t=($('ttl').value||'HW').trim(),d=$('dte').value||today();
  const it={id:uid(),kind:'hw',title:t,date:d,scores:{},closed:false,synced:false,stack:!!stack};
  fillAbsences(s,it);
  s.items.push(it);V.iid=it.id;V.az=!!stack;V.tab=0;save();
  closeSheet();go(stack?'review':'grade');
}
/* an assignment inherits that date's absences */
function fillAbsences(s,it){
  const sess=sessionOn(s,it.date);
  if(!sess)return;
  act(s).forEach(st=>{
    const c=sess.attendance[st.id],v=it.scores[st.id];
    if(ABSENT.includes(c)){if(!v||v.auto)it.scores[st.id]={code:'AB',touched:true,auto:true}}
    else if(v&&v.auto)delete it.scores[st.id];
  });
}

/* ============ attendance ============ */
VIEWS.attendance=function(){
  const s=sec(),it=item();
  const cells=act(s).slice().sort(byName).map(st=>{
    const c=it.attendance[st.id]||'P';
    const cls=c==='P'?'':(ABSENT.includes(c)?'gone':'ex');
    return `<button class="att ${cls}" onclick="pickAtt('${st.id}')">
      <div class="who">${esc(label(st))}</div>
      <div class="code">${esc(c)} · ${esc((ATT.find(a=>a[0]===c)||[,''])[1])}</div></button>`}).join('');
  const ex=Object.values(it.attendance).filter(c=>c&&c!=='P').length;
  $('app').innerHTML=head('Attendance',when(it.date),"go('section')",'Class')+
    `<p class="sub">Everyone starts present. Tap only the exceptions.</p><div class="grid2">${cells}</div>`;
  bar(`<button class="btn" onclick="doneAtt()">Done — ${ex} exception${ex===1?'':'s'}</button>`);
};
const byName=(a,b)=>(a.last+a.first).localeCompare(b.last+b.first);
function pickAtt(id){
  const s=sec();
  panel(`<div class="eyebrow">${esc(label(stu(s,id)))}</div>
    ${ATT.map(([c,n])=>`<button class="btn ghost sm" style="text-align:left;padding-left:15px"
      onclick="setAtt('${id}','${c}')"><b style="font-family:var(--mono)">${c}</b> &nbsp; ${n}</button>`).join('')}`);
}
function setAtt(id,c){
  const s=sec(),it=item();
  it.attendance[id]=c;it.synced=false;
  // every assignment on this date follows the correction
  hwsOn(s,it.date).forEach(h=>{fillAbsences(s,h);h.synced=false});
  save();render();
}
function doneAtt(){const it=item();it.closed=true;save();go('section');syncSection(V.sid,true)}

/* ============ grading at the tables ============ */
VIEWS.grade=function(){
  const s=sec(),it=item(),i=V.tab||0;
  const order=[3,4,5,2,1,0];
  // table buttons live in the fixed bar: after grading four students your thumb
  // is already at the bottom of the screen, so the next table is right there
  const tabs=order.map(t=>{
    const ids=tableIds(s,t);
    const todo=ids.some(id=>!(it.scores[id]||{}).touched);
    const cls=t===i?'now':!ids.length?'empty':todo?'todo':'done';
    return `<button class="tab ${cls}" onclick="V.tab=${t};render();window.scrollTo(0,0)">${t+1}</button>`}).join('');
  const ids=tableIds(s,i);
  const rows=ids.map(id=>gradeRow(s,it,id)).join('')||'<div class="empty">No one at this table.</div>';
  const left=act(s).filter(st=>!(it.scores[st.id]||{}).touched).length;
  $('app').innerHTML=head(it.title,`Table ${i+1}`,"go('section')",'Class')+
    `<div class="card">${rows}</div>`;
  bar(`<div class="tabs">${tabs}</div>
      <button class="btn sm" onclick="V.az=false;go('review')">Done grading${left?` — ${left} left`:''}</button>`);
};
function gradeRow(s,it,id){
  const st=stu(s,id),v=it.scores[id]||{},cur=markOf(v)||'--',un=!v.touched;
  const q=tableQueue(s,id,it.id);
  const chip=(k,on)=>`<button class="chip ${on?'on '+toneOf(k):''}" onclick="setMark('${id}','${k}')">${show(k)}</button>`;
  return `<div class="student ${un?'untouched':''}">
    <div class="row"><div class="grow"><div class="name trunc">${esc(label(st))}</div>
      <div class="meta">${esc(nameOf(cur))}${v.auto?' · auto':''}</div></div>
      <button class="chip dash ${un?'on warn':'quiet'}" onclick="setMark('${id}','--')">—</button></div>
    <div class="strip">${MARKS.map(m=>chip(m[0],cur===m[0])).join('')}</div>
    ${q.length?`<div class="warnbox" style="margin:7px 0 0"><div class="row"><div class="grow">
      <div class="meta" style="color:var(--attention)">${q.length===1
        ? (effective(q[0].scores[id])==='--'?'I never checked '+esc(q[0].title):'Owes '+esc(q[0].title))
        : `Owes ${q.length} — ${esc(q[0].title)} to ${esc(q[q.length-1].title)}`}</div></div>
      <button class="chip quiet" style="width:82px;padding:8px 0" onclick="catchUp('${id}')">Catch up</button>
      </div></div>`:''}
  </div>`;
}
function setMark(id,k){
  const it=item();
  if(k==='--')delete it.scores[id];
  else it.scores[id]=/^[0-9]$/.test(k)?{val:+k,touched:true}:{code:k,touched:true};
  it.synced=false;save();render();
}
function firstTodo(){
  const s=sec(),it=item();if(!it)return 0;
  for(const t of [3,4,5,2,1,0]){const ids=tableIds(s,t);
    if(ids.length&&ids.some(id=>!(it.scores[id]||{}).touched))return t}
  return 3;
}

/* ============ review ============ */
VIEWS.review=function(){
  const s=sec(),it=item();
  const cell=id=>{
    const st=stu(s,id),v=it.scores[id]||{},k=markOf(v)||'--';
    return `<button class="rv ${['good','bad','info','ex'].includes(toneOf(k))?toneOf(k):'none'}"
      onclick="pickAny('${id}')"><span class="mk">${esc(show(k))}</span>
      <span class="who">${esc(label(st))}</span>${v.auto?'<span class="meta">auto</span>':''}</button>`;
  };
  let cells;
  if(V.az){
    cells=`<div class="grid2">${act(s).slice().sort(byName).map(x=>cell(x.id)).join('')}</div>`;
  }else{
    // grouped by table, so what's on screen matches how you walked the room
    cells=[3,4,5,2,1,0].map(t=>{
      const ids=tableIds(s,t);
      if(!ids.length)return '';
      return `<div class="eyebrow" style="display:block;margin:12px 0 5px">Table ${t+1}</div>
        <div class="grid2">${ids.map(cell).join('')}</div>`;
    }).join('');
  }
  const count={};act(s).forEach(st=>{const k=markOf(it.scores[st.id]||{})||'--';count[k]=(count[k]||0)+1});
  const un=count['--']||0;
  const tally=['5','4','NC','MU','AB'].filter(k=>count[k]).map(k=>`<span>${k} · ${count[k]}</span>`).join('')+
    (un?`<span class="warn">not checked · ${un}</span>`:'');
  $('app').innerHTML=head(it.closed?'Scores':'Review',esc(it.title)+' · '+when(it.date),
      V.list?"V.list=false;go('bywork')":it.stack?"go('section')":"go('grade')",
      V.list?'Assignments':it.stack?'Class':'Tables')+banner()+
    cells+
     `${un&&!it.closed?`<div class="warnbox" style="margin-top:11px"><div class="meta" style="color:var(--attention)">
       ${un} unchecked. They stay blank and show up in Late work — no score is invented.</div></div>`:''}
     <div class="tally" style="margin:14px 0 0">${tally}
       <span onclick="V.az=!V.az;render()" style="cursor:pointer;${V.az?'color:var(--ink);border-color:var(--ink)':''}">${V.az?'A–Z':'by table'} ⇅</span>
       <span onclick="renameSheet()" style="cursor:pointer">rename ✎</span></div>`;
  bar(it.closed
    ? `<button class="btn ghost" onclick="${V.list?"V.list=false;go('bywork')":"go('section')"}">Done</button>`
    : (un?`<button class="btn ghost sm" onclick="fillSheet()">Fill the other ${un} with…</button>`:'')+
      `<button class="btn ${un?'warn':''}" onclick="closeHw()">Close ${esc(it.title)}</button>`);
};
/* Score a handful by hand, then give everyone left the same mark. Only students
   with no mark yet are touched — nothing you already entered is overwritten. */
function fillSheet(){
  const s=sec(),it=item();
  const n=act(s).filter(st=>!(it.scores[st.id]||{}).touched).length;
  panel(`<div class="eyebrow">${n} still unmarked</div>
    <h1 style="margin:6px 0 12px">Give them all…</h1>
    ${MARKS.map(([k,name])=>`<button class="btn ghost sm" style="text-align:left;padding-left:15px"
      onclick="fillRest('${k}')"><b style="font-family:var(--mono)">${show(k)}</b> &nbsp; ${name}</button>`).join('')}
    <button class="btn ghost sm" onclick="closeSheet()">Cancel</button>`);
}
function fillRest(k){
  const s=sec(),it=item();
  act(s).forEach(st=>{
    if((it.scores[st.id]||{}).touched)return;
    it.scores[st.id]=/^[0-9]$/.test(k)?{val:+k,touched:true}:{code:k,touched:true};
  });
  it.synced=false;save();closeSheet();render();
}
function pickAny(id){
  const s=sec(),it=item();
  panel(`<div class="eyebrow">${esc(label(stu(s,id)))}</div>
    ${(it.closed?ALLX:ALL).map(([k,n])=>`<button class="btn ghost sm" style="text-align:left;padding-left:15px"
      onclick="setMark('${id}','${k}');closeSheet()"><b style="font-family:var(--mono)">${show(k)}</b> &nbsp; ${n}</button>`).join('')}`);
}
function renameSheet(){
  const it=item();
  panel(`<div class="eyebrow">Assignment</div><div style="height:9px"></div>
    <input type="text" id="ren" value="${esc(it.title)}" autocomplete="off">
    <div style="height:9px"></div>
    <input type="date" id="rdt" value="${esc(it.date)}">
    <button class="btn" onclick="doRename()">Save</button>
    <button class="btn ghost sm" onclick="closeSheet()">Cancel</button>`);
}
function doRename(){
  const s=sec(),it=item(),t=($('ren').value||'').trim(),d=$('rdt').value||it.date;
  if(t)it.title=t;
  if(d!==it.date){it.date=d;fillAbsences(s,it)}
  it.synced=false;save();closeSheet();render();
}
function closeHw(){
  const s=sec(),it=item();
  act(s).forEach(st=>{if(!(it.scores[st.id]||{}).touched)it.scores[st.id]={code:'--',missed:true}});
  it.closed=true;it.synced=false;save();go('section');syncSection(s.id,true);
}

/* ============ late work, by assignment ============ */
VIEWS.late=function(){
  const s=sec(),owed=owedIndex(s);
  const rows=closedHws(s).slice().reverse().map(h=>{
    const who=owed[h.id]||[];
    if(!who.length)return '';
    return `<button class="rv none" style="margin-bottom:6px" onclick="V.iid='${h.id}';go('lateone')">
      <span class="mk">${who.length}</span><span class="who">${esc(h.title)}</span>
      <span class="meta">${esc(when(h.date))}</span></button>`}).join('');
  $('app').innerHTML=head('Late work',esc(s.name),"go('section')",'Class')+
    (rows?`<p class="sub">Pick the assignment, then work down the pile.</p>${rows}`
        :'<div class="empty">Nothing outstanding.</div>');
  bar('');
};

/* Records — the same grades from either direction */
VIEWS.records=function(){
  const s=sec();
  V.list=false;
  $('app').innerHTML=head('Gradebook',esc(s.name),"go('section')",'Class')+
    `<p class="sub">Every score is editable from either side.</p>
     <button class="card tap" onclick="go('people')"><div class="name">By student</div>
       <div class="meta">${act(s).length} enrolled · one student's whole history</div></button>
     <button class="card tap" onclick="go('bywork')"><div class="name">By assignment</div>
       <div class="meta">${closedHws(s).length} closed · the whole class at once</div></button>`;
  bar('');
};

VIEWS.bywork=function(){
  const s=sec(),owed=owedIndex(s);
  const rows=hws(s).slice().reverse().map(h=>{
    const who=(owed[h.id]||[]).length, need=needScore(s,h);
    const note=!h.closed?'unfinished':need?`${need} to score`:who?`${who} not yet 4/5`:'all passing';

/* A gap the student caused (AB, MU, NC) is made-up work, so it becomes a regrade.
   A gap I caused — the dash, never checked — has no original score yet, so the
   mark belongs in the original column instead. */
function fillsOriginal(v){return markOf(v)==='--'||!markOf(v)}
function applyScore(h,id,val){
  const v=Object.assign({},h.scores[id]||{});
  if(fillsOriginal(v)){
    delete v.missed;delete v.rev;delete v.sent;delete v.code;delete v.val;delete v.auto;
    if(val!==''){if(/^[0-9]$/.test(val))v.val=+val;else v.code=val;v.touched=true}
    else{v.code='--';v.missed=true}
  }else{
    if(val===''){delete v.rev;delete v.sent}
    else{v.rev=/^[0-9]$/.test(val)?+val:val;v.sent=false}
  }
  h.scores[id]=v;h.synced=false;
}
function setLate(id,val){
  const h=item();applyScore(h,id,val);save();render();
}
/* One panel, everything this student still owes. A status correction (MU/AB)
   replaces the original mark, because it's saying the original was wrong. A
   real result (5/4/NC) fills the original if nothing was ever recorded, or
   lands as a regrade beside it if there was. */
function catchUpMark(id,hid,k){
  const s=sec(),h=s.items.find(x=>x.id===hid),v=Object.assign({},h.scores[id]||{});
  if(k==='MU'||k==='AB'){
    delete v.val;delete v.rev;delete v.sent;delete v.missed;delete v.auto;
    v.code=k;v.touched=true;
  }else if(fillsOriginal(v)){
    delete v.missed;delete v.code;delete v.val;delete v.auto;
    if(/^[0-9]$/.test(k))v.val=+k;else v.code=k;
    v.touched=true;
  }else{
    v.rev=/^[0-9]$/.test(k)?+k:k;v.sent=false;
  }
  h.scores[id]=v;h.synced=false;save();catchUp(id);
}
function catchUp(id){
  const s=sec(),it=item(),q=tableQueue(s,id,it?it.id:null);
  if(!q.length){closeSheet();render();return}
  panel(`<div class="eyebrow">${esc(label(stu(s,id)))} · ${q.length} outstanding</div>
    <p class="sub" style="margin:10px 0 4px">Oldest first. MU and AB correct the mark itself;
      a number or NC records what they actually turned in.</p>
    ${q.map(h=>{
      const v=h.scores[id]||{},cur=effective(v)||'--';
      return `<div class="student">
        <div class="row"><div class="grow">
          <div class="name trunc">${esc(h.title)}</div>
          <div class="meta">${esc(when(h.date))} · now ${esc(show(cur))}</div></div></div>
        <div class="strip">${['5','4','NC','MU','AB'].map(k=>
          `<button class="chip ${cur===k?'on '+toneOf(k):''}"
            onclick="catchUpMark('${id}','${h.id}','${k}')">${k}</button>`).join('')}</div>
      </div>`}).join('')}
    <button class="btn ghost sm" onclick="closeSheet();render()">Done</button>`);
}

/* Read the arrangement back out of the seat tab. Names there are the ones the
   app wrote into column P, so they should match exactly; anything that doesn't
   is reported rather than guessed at. */
async function pullSeats(){
  const s=sec(),c=S.cfg;
  if(!c.url||!c.token){alert('Connect your sheet first — Settings, Sheet sync.');return}
  V.busy='Reading the seating chart…';V.err=V.ok=null;render();
  try{
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:c.token,action:'seats',section:s.name})});
    const d=await r.json();
    V.busy=null;
    if(!d.ok){V.err=d.error||'Could not read the seating chart.';render();return}
    const key=n=>String(n||'').replace(/\s+/g,' ').trim().toLowerCase();
    // a seat cell can hold your wording from column O, the app's full name,
    // or the plain "First L." — all three resolve to the same student
    const byName={};
    act(s).forEach(st=>{byName[key(seatName(st))]=st.id;byName[key(fullSeat(st))]=st.id});
    (d.alias||[]).forEach(([shown,appName])=>{
      const id=byName[key(appName)];
      if(id&&!byName[key(shown)])byName[key(shown)]=id;
    });
    const fresh=[],missed=[];let placed=0;
    for(let t=1;t<=TABLES;t++){
      const names=d.tables[t]||d.tables[String(t)]||[];
      const row=[];
      for(let k=0;k<SEATS;k++){
        const n=names[k]||'';
        if(!n){row.push(null);continue}
        const id=byName[key(n)];
        if(id){row.push(id);placed++}else{row.push(null);missed.push(n)}
      }
      fresh.push(row);
    }
    s.tables=fresh;save();
    const left=unseated(s).length;
    V.ok=`Seated ${placed}`+(left?` · ${left} not on the chart`:'')+
      (missed.length?` · couldn't match: ${missed.join(', ')}`:'');
    render();
  }catch(e){
    V.busy=null;V.err='Could not reach the sheet. Your current seating is unchanged.';render();
  }
}
function autoSeat(){
  const s=sec();
  unseated(s).slice().sort(byName).forEach(st=>place(s.tables,st.id));
  save();render();
}

  giveCubbies(s,fresh);          // fills the lowest gap a leaver left behind

/* Deletes this class's tabs entirely and rebuilds them fresh from the phone.
   For a tab that's accumulated cruft not worth untangling — old test data,
   months of format churn — this is faster and safer than editing it by hand. */
async function wipeAndRebuild(){
  const s=sec(),c=S.cfg;
  if(!c.url||!c.token)return alert('Connect your sheet first — Settings, Sheet sync.');
  if(!confirm(`Start "${s.name}" over in the sheet?\n\n`+
    `Deletes its gradebook, attendance, and seating tabs completely, then rebuilds `+
    `them from what's on this phone.\n\n`+
    `Nothing here is at risk — but anything that lived only in the sheet (a `+
    `seating arrangement, notes you typed there by hand) will be gone.`))return;
  V.busy='Clearing the old tabs…';V.err=V.ok=null;render();
  try{
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:c.token,action:'wipe',section:s.name})});
    const d=await r.json();
    if(!d.ok){V.busy=null;V.err=d.error||'The script refused the request.';render();return}
    s.items.forEach(x=>{if(x.closed)x.synced=false});
    save();
    V.busy='Rebuilding…';render();
    await syncSection(s.id,true,true);
    V.ok='Rebuilt — '+(d.dropped&&d.dropped.length?d.dropped.length+' old tab(s) replaced.':'fresh tabs created.');
    render();
  }catch(e){
    V.busy=null;V.err='Could not reach the sheet — nothing was changed.';render();
  }
}
function dropSection(){
  const s=sec(),n=closedHws(s).length,un=unsynced(s).length;
  if(!confirm(`Delete "${s.name}"?\n\n${act(s).length} students and ${n} assignment${n===1?'':'s'} `+
    `will be removed from this phone.\n\n`+(un?`${un} record${un===1?'':'s'} have NOT reached the sheet — those are gone for good.`
      :`Anything already in the sheet stays there.`)))return;
  S.sections=S.sections.filter(x=>x.id!==s.id);
  forget(s.id);V.sid=V.iid=V.hid=null;saveAll();go('home');
}

/* Apps Script gets killed at 6 minutes. A whole year resent in one request
   would land somewhere around that line, and a timeout mid-write leaves the
   sheet half-rewritten — so a full resend goes over in chunks. Each chunk is
   its own request, well inside the limit, and each carries the complete id
   list so the script's cleanup pass still sees the whole picture. */
const CHUNK=40;

async function syncSection(id,quiet,full){
  const s=S.sections.find(x=>x.id===id),c=S.cfg;
  if(!c.url||!c.token){if(quiet)return;go('sync');return}
  const pend=unsynced(s);
  // an explicit full resend, not a normal after-class sync, is the one moment
  // the payload is a complete history — it's the only time it's safe for the
  // script to remove a column nothing here matches
  full=!!full&&pend.length===closedHws(s).length+sessions(s).filter(x=>x.closed).length;
  if(!pend.length){if(!quiet)alert('Nothing new to send.');return}

  const key=st=>`${st.last.trim().toLowerCase()}|${st.first.trim().toLowerCase()}`;
  const kk={};s.students.forEach(st=>kk[st.id]=key(st));
  const roster=act(s).slice().sort(byName).map(st=>({last:st.last,first:st.first,
    seat:seatName(st),full:fullSeat(st)}));
  const allIds=full?closedHws(s).map(h=>h.id):null;
  const pack=x=>{
    const o={id:x.id,kind:x.kind,date:x.date,iso:x.date,label:when(x.date)};
    if(x.kind==='session'){o.attendance={};act(s).forEach(st=>o.attendance[kk[st.id]]=x.attendance[st.id]||'P')}
    else{o.title=x.title;o.scores={};
      s.students.forEach(st=>{const v=x.scores[st.id];
        if(v)o.scores[kk[st.id]]={val:v.val,code:v.code,rev:v.rev,sent:!!v.sent}})}
    return o;
  };

  const batches=[];
  for(let i=0;i<pend.length;i+=CHUNK)batches.push(pend.slice(i,i+CHUNK));
  V.err=V.ok=null;
  let sentCount=0,matched='',unmatched=0;

  for(let b=0;b<batches.length;b++){
    V.busy=batches.length>1
      ? `Sending ${sentCount+batches[b].length} of ${pend.length}…`
      : `Sending ${pend.length}…`;
    render();
    const payload={token:c.token,full,section:s.name,idx:S.sections.indexOf(s),students:roster,
      items:batches[b].map(pack)};
    if(full){payload.allIds=allIds;payload.last=(b===batches.length-1)}
    try{
      const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(payload)});
      const d=await r.json();
      if(!d.ok){
        V.busy=null;
        // whatever already went through stays marked sent — a retry picks up
        // exactly where this stopped rather than starting over
        V.err=(d.error||'The sheet refused the write.')+
          (sentCount?` (${sentCount} of ${pend.length} had already gone through)`:'');
        save();render();return;
      }
      batches[b].forEach(x=>x.synced=true);
      sentCount+=batches[b].length;
      matched=d.matched||matched;
      unmatched=(d.unmatched&&d.unmatched.length)||unmatched;
      save();
    }catch(e){
      V.busy=null;
      V.err='Could not reach the sheet. Everything is safe on this phone — try again on better wifi.'+
        (sentCount?` (${sentCount} of ${pend.length} had already gone through)`:'');
      save();render();return;
    }
  }

  V.busy=null;
  const keep=V.sid;V.sid=s.id;
  V.ok=`Sent ${sentCount} · ${matched} students`+(unmatched?` · ${unmatched} unmatched`:'');
  save();V.sid=keep;render();
}

function markSentFor(id){
  const s=S.sections.find(x=>x.id===id);
  hws(s).forEach(h=>{
    let hit=false;
    Object.values(h.scores).forEach(v=>{if(v&&v.rev!=null&&!v.sent){v.sent=true;hit=true}});
    if(hit)h.synced=false;
  });
  save();syncSection(id,true);
}

/* ============ backup ============ */
/* Backup means one thing: getting a copy of your data out, and putting one
   back. Sending data to the sheet and managing regrade highlights are sync
   concerns, not backup concerns — they live on the Sheet sync screen so they
   aren't duplicated in two places. */
VIEWS.backup=function(){
  $('app').innerHTML=head('Backup','all classes',"go('menu')",'Settings')+banner()+
    `<p class="sub">Copy of everything on this phone — email it to yourself. Contains your
      sheet token and student names, so keep it private.</p>
     <textarea readonly id="dump" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></textarea>
     <button class="btn sm" onclick="makeBackup()">Copy backup</button>

     <p class="sub" style="margin-top:22px">A copy also lands in Drive automatically, once a
       week, in a folder called "Homework Check backups". Those leave out the token, so
       you'll re-enter it after restoring from one.</p>
     <div class="meta" style="margin-bottom:7px">Last Drive backup: ${backupAge()===null?'never'
       :backupAge()===0?'today':backupAge()+' days ago'}${S.cfg.backupName?' · '+esc(S.cfg.backupName):''}</div>
     <button class="btn sm ghost" onclick="backupNow()">Back up to Drive now</button>

     <p class="sub" style="margin-top:22px">Restore — paste either kind of copy here. This
       replaces everything currently on this phone.</p>
     <textarea id="load" style="min-height:80px" placeholder='{"sections":[...]}'></textarea>
     <button class="btn sm ghost" onclick="restoreAll()">Restore</button>`;
  bar(`<button class="btn ghost" onclick="go('menu')">Done</button>`);
};
const WEEK=7*24*60*60*1000;
/* Bump on every release. A home-screen app caches its page separately from
   Safari and will happily run an old build for hours, so make it say which. */
const BUILD='2026-08-19 · 27';
/* {cache:'no-store'} makes the browser skip its disk cache and actually ask the
   server — a plain reload or query-string trick can still be answered from a
   cached copy on iOS, especially inside a home-screen app. Comparing the fetched
   BUILD string against this page's is how we know whether it worked, instead of
   just reloading and hoping. */
async function forceUpdate(){
  V.busy='Checking for an update…';V.err=V.ok=null;render();
  try{
    const r=await fetch(location.pathname,{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/const BUILD='([^']+)'/);
    V.busy=null;
    if(!m){V.err='Could not read the new build. Try again in a minute.';render();return}
    if(m[1]===BUILD){V.ok='Already on the latest build ('+esc(BUILD)+').';render();return}
    sessionStorage.setItem('hw:afterUpdate','menu');
    location.replace(location.pathname+'?v='+Date.now());
  }catch(e){
    V.busy=null;V.err='Could not reach the server to check.';render();
  }
}
/* Data only — never the URL or token. These files live in Drive indefinitely,
   and the token is write access to the gradebook. */
const backupBlob=()=>JSON.stringify({sections:S.sections,cfg:{}});
function backupAge(){
  if(!S.cfg.lastBackup)return null;
  return Math.floor((Date.now()-S.cfg.lastBackup)/86400000);
}
/* Fires when the app opens and the last copy is over a week old. Never blocks
   anything: a failure just leaves the age showing on the home screen. */
async function autoBackup(){
  const c=S.cfg;
  if(!c.url||!c.token){V.bkErr='No sheet connected.';return}
  if(S.cfg.lastBackup&&Date.now()-S.cfg.lastBackup<WEEK)return;
  if(V.backingUp)return;
  V.backingUp=true;V.bkErr=null;
  try{
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:c.token,action:'backup',blob:backupBlob()})});
    const d=await r.json();
    if(d.ok&&d.saved){S.cfg.lastBackup=Date.now();S.cfg.backupName=d.saved;saveAll();
      if(V.view==='home'||V.view==='backup')render()}
    // the script answered but saved nothing — that reason is the useful part
    else if(d.ok)V.bkErr='The script ran but saved nothing — it is still on the old version. Redeploy.';
    else V.bkErr=String(d.error||'The script refused the request.');
  }catch(e){V.bkErr='No answer from the script: '+String((e&&e.message)||e)}
  V.backingUp=false;
}
function makeBackup(){
  const el=$('dump');
  el.value=JSON.stringify({sections:S.sections,cfg:S.cfg});   // by hand: keep the token
  copyBox('dump');
  V.ok='Backup copied — paste it into an email to yourself.';render();
}
async function backupNow(){
  V.busy='Saving to Drive…';V.err=V.ok=null;render();
  S.cfg.lastBackup=null;await autoBackup();
  V.busy=null;
  if(S.cfg.lastBackup)V.ok='Saved to Drive — '+esc(S.cfg.backupName||'');
  else V.err=(V.bkErr||'Could not reach Drive.')+' Copy the backup by hand meanwhile.';
  render();
}
function copyBox(id){
  const el=$(id);el.select&&el.select();el.setSelectionRange&&el.setSelectionRange(0,999999);
  if(navigator.clipboard)navigator.clipboard.writeText(el.value).catch(()=>{});
}
function resendAll(){
  const n=S.sections.reduce((a,s)=>a+s.items.filter(x=>x.closed).length,0);
  if(!confirm(`Resend ${n} record${n===1?'':'s'} to the sheet?\n\n`+
    `Rewrites every column from what's on this phone, and removes any leftover `+
    `column an old rename or edit orphaned.`))return;
  S.sections.forEach(s=>s.items.forEach(x=>{if(x.closed)x.synced=false}));
  saveAll();
  S.sections.forEach(s=>{if(unsynced(s).length)syncSection(s.id,true,true)});
}
/* The cubby list covers every class at once, so it can't ride along with a
   per-class sync — the sheet needs them all together to lay out three across. */
async function pushCubbies(){
  const c=S.cfg;
  if(!c.url||!c.token)return alert('Connect your sheet first — Settings, Sheet sync.');
  V.busy='Building the cubby list…';V.err=V.ok=null;render();
  const classes=S.sections.map(s=>({
    name:s.name,
    students:act(s).slice().sort(byName).map(st=>({last:st.last,first:st.first,num:st.num||''}))
  })).filter(x=>x.students.length);
  if(!classes.length){V.busy=null;V.err='No students to list yet.';render();return}
  try{
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:c.token,action:'cubbies',classes})});
    const d=await r.json();
    V.busy=null;
    if(!d.ok){V.err=d.error||'The script refused the request.';render();return}
    V.ok=`Cubby list built — ${d.classes} class${d.classes===1?'':'es'}, ${d.students} students.`;
    render();
  }catch(e){
    V.busy=null;V.err='Could not reach the sheet.';render();
  }
}
function restoreAll(){
  let o;
  try{o=JSON.parse($('load').value)}catch(e){return alert('Not a valid backup — paste the whole thing, starting with {')}
  if(!o||!Array.isArray(o.sections))return alert('That backup has no classes in it.');
  const n=o.sections.length,m=o.sections.reduce((a,x)=>a+((x.items||x.meetings||[]).length),0);
  if(!confirm(`Restore ${n} class${n===1?'':'es'} and ${m} record${m===1?'':'s'}?\n\nEverything on this phone will be replaced.`))return;
  o.cfg=o.cfg||{};o.sections.forEach(migrate);
  S={sections:o.sections,cfg:o.cfg};V.sid=V.iid=V.hid=null;saveAll();go('home');
}

const resume=sessionStorage.getItem('hw:afterUpdate');
if(resume){
  sessionStorage.removeItem('hw:afterUpdate');
  V.view=resume;V.ok='Updated — now on build '+BUILD+'.';
}
render();
autoBackup();
</script>
</body>
</html>
